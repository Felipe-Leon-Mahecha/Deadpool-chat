<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deadpool Chat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
  <main class="chatApp">
    <header class="chatHeader">
      <h1 class="chatTitle">Deadpool</h1>
      <p class="chatSubtitle">Mercenario bocón · siempre regenerándose</p>
    </header>

    <section class="chatMessages" aria-label="Mensajes">
      <div class="message message--character">
        Oye, ¿otro humano queriendo chatear? Bienvenido a mi caos.
      </div>
    </section>

    <form class="chatComposer">
      <input
        class="chatInput"
        type="text"
        placeholder="Escribile algo a Deadpool…"
        aria-label="Escribe tu mensaje"
      />
      <button class="chatSend" type="submit">Enviar</button>
    </form>
  </main>
</div>
</body>
</html>
